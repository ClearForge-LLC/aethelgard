[workspace]
resolver = "2"
members = [
    "crates/aethelgard-ir",
    "crates/aethelgard-eda",
    "crates/aethelgard-svd-hal",
    "crates/aethelgard-twin",
    "crates/aethelgard-chaos",
    "crates/aethelgard-evolve",
    "crates/aethelgard-cli",
]
# Generated board crates (AET-WO-1400): never members, so the workspace's
# lints and `forbid(unsafe_code)` do not reach their `mmio` module (RUL-04).
exclude = ["boards"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ClearForge-LLC/aethelgard"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aethelgard-ir = { path = "crates/aethelgard-ir" }
aethelgard-svd-hal = { path = "crates/aethelgard-svd-hal" }
aethelgard-eda = { path = "crates/aethelgard-eda" }
clap = { version = "4", features = ["derive"] }
landlock = "0.4.7"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21"
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
seccompiler = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
thiserror = "2"
toml = "0.9"
trybuild = "1.0.122"
# The reference board's generated crate, a dev-dependency of aethelgard-svd-hal's
# trybuild suite only. A path outside `members` stays outside the workspace.
sentinel-01-board = { path = "boards/sentinel-01" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "process", "signal", "io-util", "sync", "time"] }
