[workspace]
resolver = "2"
members = [
    "crates/aethelgard-ir",
    "crates/aethelgard-eda",
    "crates/aethelgard-kicad-lib",
    "crates/aethelgard-svd-hal",
    "crates/aethelgard-twin",
    "crates/aethelgard-chaos",
    "crates/aethelgard-evolve",
    "crates/aethelgard-pincheck",
    "crates/aethelgard-hwdef",
    "crates/aethelgard-cli",
    "models/renode",
]
# Generated board crates (AET-WO-1400) and the analog bridge (AET-WO-2200):
# never members, so the workspace's lints and `forbid(unsafe_code)` do not reach
# a board's `mmio` module (RUL-04) or the bridge's `ffi` module (RUL-17).
exclude = ["boards", "bridge"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ClearForge-LLC/aethelgard"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aethelgard-ir = { path = "crates/aethelgard-ir", version = "0.2.0" }
aethelgard-chaos = { path = "crates/aethelgard-chaos", version = "0.2.0" }
aethelgard-evolve = { path = "crates/aethelgard-evolve", version = "0.2.0" }
aethelgard-svd-hal = { path = "crates/aethelgard-svd-hal", version = "0.2.0" }
aethelgard-twin = { path = "crates/aethelgard-twin", version = "0.2.0" }
aethelgard-eda = { path = "crates/aethelgard-eda", version = "0.2.0" }
aethelgard-kicad-lib = { path = "crates/aethelgard-kicad-lib", version = "0.2.0" }
aethelgard-pincheck = { path = "crates/aethelgard-pincheck", version = "0.2.0" }
aethelgard-hwdef = { path = "crates/aethelgard-hwdef", version = "0.2.0" }
aethelgard-renode-models = { path = "models/renode", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
landlock = "0.4.7"
# AET-WO-4412 (ruled 2026-11-26T17:35Z): pincheck inflates a ROMFS defaults.parm (raw deflate). MIT OR Zlib OR Apache-2.0, forbid(unsafe_code).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.21"
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
seccompiler = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
thiserror = "2"
toml = "0.9"
trybuild = "1.0.122"
# The reference board's generated crate, a dev-dependency of aethelgard-svd-hal's
# trybuild suite only. A path outside `members` stays outside the workspace.
sentinel-01-board = { path = "boards/sentinel-01" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "process", "signal", "io-util", "sync", "time"] }

# The router and placer run in debug builds in every test (1302 B9): about 6 to
# 7 times faster at opt-level 2, with debug assertions kept. Dev builds only; the
# release profile and every generated file are untouched.
[profile.dev.package.aethelgard-eda]
opt-level = 2

# The CLI hashes and parses ST's 2.1 MB `stm32h753xx.h` on every `pin_table`
# and `register_facts` call, so every test that runs the dev-built CLI paid it
# unoptimised (`AET-WO-1910` F2, ruled D7 on PR #233, comment 6999515740).
# Measured on 4 CPUs: `boot_tier1` 120.8 s -> 31.5 s, `campaign_tier1` 47.1 s ->
# 9.1 s (each stanza alone, `boot_tier1`: sha2 74.2 s, svd-hal 64.7 s). As for
# `aethelgard-eda` above: dev builds only, with debug assertions and overflow
# checks kept on; the release profile and every generated file are untouched.
[profile.dev.package.aethelgard-svd-hal]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
