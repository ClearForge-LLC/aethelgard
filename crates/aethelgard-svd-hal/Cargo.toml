[package]
name = "aethelgard-svd-hal"
description = "Aethelgard vendor register description ingestion and generated board crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stm32","svd","hal","embedded"]
categories = ["embedded","development-tools"]

[dependencies]
aethelgard-ir.workspace = true
roxmltree.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The regeneration guard calls `aethelgard generate`'s composition function
# (AET-WO-3301 §1.5). Path-only, as for `aethelgard-twin`: the CLI depends on
# this crate, so a versioned dev-dependency back would make a publish a cycle.
aethelgard-cli = { path = "../aethelgard-cli" }
# The firmware's boot contract and record layout are checked against the judge's.
aethelgard-twin = { path = "../aethelgard-twin" }
sentinel-01-board.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
