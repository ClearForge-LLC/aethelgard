description = "Aethelgard's pinout check: what a linked STM32H7 firmware writes to the GPIO registers at reset, judged against the solved topology."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["stm32","gpio","elf","pinout","embedded"]
