[package]
name = "aethelgard-cli"
description = "The aethelgard binary: JSON on stdin and stdout, documented exit codes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["embedded","hardware","cli","firmware","kicad"]
categories = ["command-line-utilities","embedded"]

[[bin]]
name = "aethelgard"
path = "src/main.rs"

[features]
# Tier-2 tests that run the real tools; only the `tools` CI job, inside the
# published image, enables it.
with-tools = []

[dependencies]
aethelgard-chaos.workspace = true
aethelgard-evolve.workspace = true
aethelgard-ir.workspace = true
aethelgard-svd-hal.workspace = true
aethelgard-eda.workspace = true
aethelgard-twin.workspace = true
clap.workspace = true
landlock.workspace = true
rmcp.workspace = true
rustix.workspace = true
seccompiler.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
# Used only by examples/sandbox_probe.rs, tier 1's stand-in tool: a safe
# io_uring_setup (rustix's is an unsafe fn).
io-uring = "0.7.15"
syn.workspace = true
toml.workspace = true

[lints]
workspace = true
