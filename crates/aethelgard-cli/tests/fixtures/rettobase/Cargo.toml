# A test fixture, not a workspace member and not shipped: a firmware that nests two external
# interrupts and records ICSR in each, the regression witness of Renode's RETTOBASE (AET-WO-4400e3,
# AET-WO-1605). Its own `[workspace]` keeps the repository root from claiming it; no
# dependencies and no build script.
[package]
name = "aet-rettobase-fixture"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
