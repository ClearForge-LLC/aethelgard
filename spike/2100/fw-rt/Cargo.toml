# AET-WO-2100 spike, S2 option 2: the cortex-m-rt runtime crate instead of a
# hand-written vector table. Its own workspace; the build deletes `spike/`.
[package]
name = "aet-2100-fw-rt"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
sentinel-01-board = { path = "../../../boards/sentinel-01" }
cortex-m-rt = "0.7"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"

[workspace]
