# AET-WO-2100 spike, S2 option 1: a hand-written vector table and linker
# script, no dependency but the board crate. Its own workspace; the build
# deletes `spike/`.
[package]
name = "aet-2100-fw-bare"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
sentinel-01-board = { path = "../../../boards/sentinel-01" }

[features]
# S3's UART candidate: raw USART3 writes, around the board crate.
uart = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"

[workspace]
