# AET-WO-3400 S2: the renaming check (AET-WO-1307's name-dependence) on a variant's emitted board.
# Its own workspace, so the repository's workspace is untouched. Build with CARGO_TARGET_DIR outside
# the repository: CARGO_TARGET_DIR=~/.cache/aet-3400/target cargo run --release -- <spec> <board>
[package]
name = "aet-3400-rename"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aethelgard-eda = { path = "../../../crates/aethelgard-eda" }
aethelgard-ir = { path = "../../../crates/aethelgard-ir" }
serde_json = "1"
