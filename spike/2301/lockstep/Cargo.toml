[package]
name = "aet2301-lockstep"
version = "0.0.0"
edition = "2024"
publish = false

# A spike probe outside the root workspace (AET-WO-2301 §1, P2 and P4). No
# `unsafe` here: the FFI is ng-probe's (copied from AET-WO-2101's spike), and
# the archive is the real `aethelgard-chaos` writer and reader.
[workspace]

[[bin]]
name = "lockstep"
path = "src/main.rs"

[dependencies]
ng-probe = { path = "../ngspice" }
aethelgard-chaos = { path = "../../../crates/aethelgard-chaos" }
