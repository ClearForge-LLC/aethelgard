# AET-WO-1600 spike S4: rustix's capability calls, outside the workspace
# (its own [workspace]) so the CLI's features stay as they are. The build
# deletes it.
[package]
name = "aet-1600-caps"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "thread", "process"] }

[lints.rust]
unsafe_code = "forbid"
