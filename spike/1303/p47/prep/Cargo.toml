[package]
name = "p47-prep"
version = "0.0.0"
edition = "2024"
publish = false

# A spike probe, outside the workspace: writes the board copy, .kicad_pro and
# .kicad_dru exactly as `kicad::prepare(Check::Drc, ...)` does (fab.rs uses it
# before plotting), through the same aethelgard-eda calls.
[workspace]

[dependencies]
aethelgard-ir = { path = "../../../../crates/aethelgard-ir" }
aethelgard-eda = { path = "../../../../crates/aethelgard-eda" }
serde_json = "1"
