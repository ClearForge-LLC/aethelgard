# AET-WO-0200 spike: builds two candidate tools images and prints the answers to
# the work order's §0 as `ANSWER` lines. Measurement only; it publishes nothing.
# The build half replaces it after the architect's ruling.
name: spike-tools-image

on:
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/spike-tools-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_A_BASE: kicad/kicad:10.0.7@sha256:3224d1bf143185ecc1bd3a1082a36f37f0f4e59d707983a16515a845e3737fc6
  CANDIDATE_B_BASE: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944

jobs:
  # S1, S2, S3 (cold), S4: build each candidate with an empty cache, export its
  # layers to the Actions cache, and probe it with and without the network.
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        candidate: [a-kicad-image, b-ubuntu-apt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: runner facts, then free disk
        run: |
          echo "ANSWER runner arch=$(uname -m) cpus=$(nproc) mem_gib=$(free -g | awk '/^Mem/{print $2}')"
          echo "ANSWER runner docker=$(docker version --format '{{.Server.Version}}')"
          echo "ANSWER runner disk_free_before=$(df -BG --output=avail / | tail -1 | tr -d ' ')"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "ANSWER runner disk_free_after_cleanup=$(df -BG --output=avail / | tail -1 | tr -d ' ')"

      - name: select candidate
        run: |
          case "${{ matrix.candidate }}" in
            a-kicad-image) echo "BASE=$CANDIDATE_A_BASE" >> "$GITHUB_ENV"; echo "KICAD_FROM_APT=0" >> "$GITHUB_ENV" ;;
            b-ubuntu-apt)  echo "BASE=$CANDIDATE_B_BASE" >> "$GITHUB_ENV"; echo "KICAD_FROM_APT=1" >> "$GITHUB_ENV" ;;
          esac
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build (cold)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spike
          file: spike/Dockerfile
          build-args: |
            BASE=${{ env.BASE }}
            KICAD_FROM_APT=${{ env.KICAD_FROM_APT }}
          tags: aet-spike:${{ matrix.candidate }}
          load: true
          cache-from: type=gha,scope=${{ matrix.candidate }}
          cache-to: type=gha,mode=max,scope=${{ matrix.candidate }}

      - name: image facts
        run: |
          echo "ANSWER ${{ matrix.candidate }} cold_build_seconds=$(( $(date +%s) - BUILD_START ))"
          echo "ANSWER ${{ matrix.candidate }} image_bytes=$(docker image inspect --format '{{.Size}}' aet-spike:${{ matrix.candidate }})"
          echo "ANSWER ${{ matrix.candidate }} disk_free_after_build=$(df -BG --output=avail / | tail -1 | tr -d ' ')"
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' aet-spike:${{ matrix.candidate }} | cut -c1-200

      - name: probe (network)
        run: >-
          docker run --rm --entrypoint bash -e PROBE_MODE=net
          -v "$PWD/spike:/spike:ro" aet-spike:${{ matrix.candidate }} /spike/probe.sh
          | sed "s/^ANSWER /ANSWER ${{ matrix.candidate }} /"

      - name: probe (--network none)
        run: >-
          docker run --rm --network none --entrypoint bash -e PROBE_MODE=nonet
          -v "$PWD/spike:/spike:ro" aet-spike:${{ matrix.candidate }} /spike/probe.sh
          | sed "s/^ANSWER /ANSWER ${{ matrix.candidate }} /"

  # S3 (warm): the same build on a fresh runner, layers from the Actions cache.
  warm:
    needs: cold
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        candidate: [a-kicad-image, b-ubuntu-apt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: select candidate
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          case "${{ matrix.candidate }}" in
            a-kicad-image) echo "BASE=$CANDIDATE_A_BASE" >> "$GITHUB_ENV"; echo "KICAD_FROM_APT=0" >> "$GITHUB_ENV" ;;
            b-ubuntu-apt)  echo "BASE=$CANDIDATE_B_BASE" >> "$GITHUB_ENV"; echo "KICAD_FROM_APT=1" >> "$GITHUB_ENV" ;;
          esac
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build (warm)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spike
          file: spike/Dockerfile
          build-args: |
            BASE=${{ env.BASE }}
            KICAD_FROM_APT=${{ env.KICAD_FROM_APT }}
          tags: aet-spike:${{ matrix.candidate }}
          load: true
          cache-from: type=gha,scope=${{ matrix.candidate }}

      - name: warm facts
        run: echo "ANSWER ${{ matrix.candidate }} warm_build_seconds=$(( $(date +%s) - BUILD_START ))"

  # S1: what nixpkgs offers for the same four tools, at a pinned revision.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: nix eval at a pinned nixpkgs
        run: |
          docker run --rm nixos/nix@sha256:4eb58d639551b9484dedd00f2ec868ae8e37b8e8d61d8e76b210792a1ee50c5f sh -c '
            rev=09063bd1f2b36fd9fd793c36dfade7bd40a93dfc
            for attr in kicad renode ngspice libngspice kani kani-verifier cbmc rustc; do
              v=$(nix --extra-experimental-features "nix-command flakes" eval --raw "github:NixOS/nixpkgs/$rev#$attr.version" 2>&1 | tail -1)
              echo "ANSWER nix $attr.version=$v"
            done'

  # S5: what a pull-request job can learn about publishing to GHCR while holding
  # only `contents: read`. The publish itself is a `main`-only job (§2).
  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: registry reachability and login
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "ANSWER ghcr login_rc=$?"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://ghcr.io/v2/clearforge-llc/aethelgard-tools/tags/list)
          echo "ANSWER ghcr anonymous_tags_list_http=$code"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/orgs/ClearForge-LLC/packages/container/aethelgard-tools)
          echo "ANSWER ghcr api_package_http=$code"
