name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The CLI refuses a tool call that inherits a descriptor above 2 without
      # close-on-exec (B2); this host's runner leaks two (B7). The caller
      # must not leak, so the step prints what it inherited, then closes every
      # descriptor above 2 in a subshell (the step's own script stays open)
      # before cargo runs.
      - name: cargo test, with inherited descriptors closed
        run: |
          ls -l /proc/$$/fd
          grep -Hs '^flags:' /proc/$$/fdinfo/* || true
          (
            for fd in /proc/$BASHPID/fd/*; do
              n=${fd##*/}
              if [ "$n" -gt 2 ]; then eval "exec $n>&-"; fi
            done
            ls -l /proc/self/fd
            exec cargo test --workspace --locked
          )

      - name: validate the checked-in examples
        run: |
          cat examples/sentinel-01-minimal.json | cargo run -q -p aethelgard-cli -- validate
          status=0
          cat examples/invalid-zero-domain.json | cargo run -q -p aethelgard-cli -- validate || status=$?
          test "$status" -eq 2

      # AET-WO-1800: every publishable crate packages, in dependency order, and
      # the CLI builds from those packages alone. No token, no publish.
      - name: package every publishable crate and build the CLI from the packages
        run: |
          set -euo pipefail
          # Dependency order: cargo packages a path dependency's sibling from the
          # same invocation, so this list is also the order docs/releasing.md publishes in.
          crates="aethelgard-ir aethelgard-kicad-lib aethelgard-svd-hal aethelgard-eda aethelgard-twin aethelgard-chaos aethelgard-cli"
          # The list must be exactly the workspace members that may publish.
          cargo metadata --no-deps --format-version 1 --locked | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          want = sorted(p["name"] for p in m["packages"] if p["publish"] != [])
          have = sorted(sys.argv[1].split())
          assert want == have, f"publishable set drifted: workspace {want} vs step {have}"
          ' "$crates"
          args=""; for c in $crates; do args="$args -p $c"; done
          rm -rf target/package
          cargo package --locked $args
          python3 - $crates <<'PY'
          import re, sys, tarfile, pathlib
          for name in sys.argv[1:]:
              crate = pathlib.Path("target/package") / f"{name}-0.1.0.crate"
              tf = tarfile.open(crate)
              files = {m.name.split("/", 1)[1] for m in tf.getmembers() if m.isfile()}
              prefix = f"{name}-0.1.0/"
              size = crate.stat().st_size
              assert size < 10 * 1024 * 1024, f"{name}: {size} bytes is over the 10 MiB crates.io limit"
              need = {"LICENSE-MIT", "LICENSE-APACHE", "README.md"}
              if name == "aethelgard-kicad-lib":
                  need.add("data/kicad-10.0.7/LICENSE.md")
              if name == "aethelgard-svd-hal":
                  need |= {"data/st-cmsis-device-h7/LICENSE.md", "data/st-cmsis-device-h7/SOURCE.md",
                           "data/st-open-pin-data/LICENSE", "data/st-open-pin-data/SOURCE.md"}
              for f in sorted(need - files):
                  sys.exit(f"{name}: licence or notice file {f} is missing from the package")
              for f in sorted(files):
                  parts = f.split("/")
                  if "target" in parts or ".git" in parts or "boards" in parts:
                      sys.exit(f"{name}: forbidden path {f} in the package")
              for f in sorted(files):
                  if f.endswith(".rs") and f.startswith("src/"):
                      text = tf.extractfile(prefix + f).read().decode()
                      for t in re.findall(r"include_(?:bytes|str)!\(\s*\"([^\"]+)\"", text):
                          target = (pathlib.PurePosixPath(f).parent / t)
                          norm = []
                          for part in target.parts:
                              if part == "..": norm.pop()
                              elif part != ".": norm.append(part)
                          if "/".join(norm) not in files:
                              sys.exit(f"{name}: include target {t} (from {f}) is missing from the package")
              print(f"ok {name}: {size} bytes, {len(files)} files")
          PY
          # Build the CLI from the unpacked packages alone, offline.
          un="$RUNNER_TEMP/unpacked"; rm -rf "$un"; mkdir -p "$un"
          cfg=""
          for c in $crates; do
            tar -xzf "target/package/$c-0.1.0.crate" -C "$un"
            cfg="$cfg --config patch.crates-io.$c.path=\"$un/$c-0.1.0\""
          done
          eval cargo install --path "$un/aethelgard-cli-0.1.0" --locked --offline --root "$un/root" $cfg
          "$un/root/bin/aethelgard" validate < examples/sentinel-01-minimal.json

  # Tier 2: the tool subcommands against the real tools, inside the image
  # pinned by container/IMAGE (RUL-15). Crates are fetched and everything is
  # compiled with the network; every tool run happens under --network none.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN: >-
        docker run --rm -v ${{ github.workspace }}:/repo -w /repo
        -e CARGO_HOME=/repo/target/cargo-home -e CARGO_TARGET_DIR=/repo/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      - name: fetch crates and build, with the network
        run: $RUN "$(cat container/IMAGE)" cargo test --workspace --all-targets --locked --features aethelgard-cli/with-tools --no-run

      - name: cargo fmt inside the image
        run: $RUN --network none "$(cat container/IMAGE)" cargo fmt --all -- --check

      - name: cargo clippy inside the image, tier 2 included
        run: $RUN --network none "$(cat container/IMAGE)" cargo clippy --workspace --all-targets --locked --offline --features aethelgard-cli/with-tools -- -D warnings

      - name: cargo test inside the image, tier 1 and tier 2
        run: $RUN --network none "$(cat container/IMAGE)" cargo test --workspace --locked --offline --features aethelgard-cli/with-tools
