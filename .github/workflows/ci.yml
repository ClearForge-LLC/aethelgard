name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: validate the checked-in examples
        run: |
          cat examples/sentinel-01-minimal.json | cargo run -q -p aethelgard-cli -- validate
          status=0
          cat examples/invalid-zero-domain.json | cargo run -q -p aethelgard-cli -- validate || status=$?
          test "$status" -eq 2
