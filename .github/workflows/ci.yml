name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The analog bridge is outside the workspace (AET-WO-2200). Neither check
      # links, so both run here without libngspice; its tests run in `tools`.
      - run: cargo fmt --manifest-path bridge/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bridge/Cargo.toml --all-targets --locked -- -D warnings
      # The CLI refuses a tool call that inherits a descriptor above 2 without
      # close-on-exec (B2); this host's runner leaks two (B7). The caller
      # must not leak, so the step prints what it inherited, then closes every
      # descriptor above 2 in a subshell (the step's own script stays open)
      # before cargo runs.
      - name: cargo test, with inherited descriptors closed
        run: |
          ls -l /proc/$$/fd
          grep -Hs '^flags:' /proc/$$/fdinfo/* || true
          (
            for fd in /proc/$BASHPID/fd/*; do
              n=${fd##*/}
              if [ "$n" -gt 2 ]; then eval "exec $n>&-"; fi
            done
            ls -l /proc/self/fd
            exec cargo test --workspace --locked
          )

      - name: validate the checked-in examples
        run: |
          cat examples/sentinel-01-minimal.json | cargo run -q -p aethelgard-cli -- validate
          status=0
          cat examples/invalid-zero-domain.json | cargo run -q -p aethelgard-cli -- validate || status=$?
          test "$status" -eq 2

      # AET-WO-1800: every publishable crate packages, in dependency order, and
      # the CLI builds from those packages alone. No token, no publish.
      - name: package every publishable crate and build the CLI from the packages
        run: |
          set -euo pipefail
          # Dependency order: cargo packages a path dependency's sibling from the
          # same invocation, so this list is also the order docs/releasing.md publishes in.
          crates="aethelgard-ir aethelgard-kicad-lib aethelgard-svd-hal aethelgard-eda aethelgard-twin aethelgard-chaos aethelgard-evolve aethelgard-cli"
          # The list must be exactly the workspace members that may publish.
          want=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort | tr '\n' ' ')
          have=$(printf '%s\n' $crates | sort | tr '\n' ' ')
          test "$want" = "$have" || { echo "publishable set drifted: workspace [$want] vs step [$have]"; exit 1; }
          args=""; for c in $crates; do args="$args -p $c"; done
          rm -rf target/package
          # --no-verify (AET-WO-3200 F18, ruled 2026-11-12): 0.1.0 of each crate is
          # on crates.io, so cargo's verify build resolves a sibling to the published
          # 0.1.0, which lacks any API added since. The build below, offline from the
          # unpacked packages alone with every sibling patched to them, is the check.
          cargo package --locked --no-verify $args
          for c in $crates; do
            crate="target/package/$c-0.1.0.crate"
            files=$(tar -tzf "$crate" | grep -v '/$' | sed 's|^[^/]*/||')
            size=$(stat -c %s "$crate")
            test "$size" -lt $((10 * 1024 * 1024)) || { echo "$c: $size bytes is over the 10 MiB crates.io limit"; exit 1; }
            # kicad-lib is CC-BY-SA-4.0: KiCad's LICENSE.md is its licence, and it carries neither MIT nor Apache.
            need="README.md"
            if [ "$c" = aethelgard-kicad-lib ]; then
              need="$need data/kicad-10.0.7/LICENSE.md"
              for f in LICENSE-MIT LICENSE-APACHE; do
                if printf '%s\n' "$files" | grep -qxF "$f"; then echo "$c: $f must not be in the package"; exit 1; fi
              done
            else
              need="$need LICENSE-MIT LICENSE-APACHE"
            fi
            if [ "$c" = aethelgard-svd-hal ]; then
              need="$need data/st-cmsis-device-h7/LICENSE.md data/st-cmsis-device-h7/SOURCE.md data/st-open-pin-data/LICENSE data/st-open-pin-data/SOURCE.md"
            fi
            for f in $need; do
              printf '%s\n' "$files" | grep -qxF "$f" || { echo "$c: licence or notice file $f is missing from the package"; exit 1; }
            done
            bad=$(printf '%s\n' "$files" | grep -E '(^|/)(target|\.git|boards)(/|$)' | head -1 || true)
            test -z "$bad" || { echo "$c: forbidden path $bad in the package"; exit 1; }
            # Every include_bytes!/include_str! target must be in the package.
            for f in $(printf '%s\n' "$files" | grep -E '^src/.*\.rs$'); do
              for t in $(tar -xzOf "$crate" "$c-0.1.0/$f" | tr -s ' \n' '  ' \
                  | grep -oE 'include_(bytes|str)! ?\( ?"[^"]+"' | sed -E 's/^[^"]*"//; s/"$//'); do
                norm=$(realpath -m --relative-to=/pkg "/pkg/$(dirname "$f")/$t")
                printf '%s\n' "$files" | grep -qxF "$norm" \
                  || { echo "$c: include target $t (from $f) is missing from the package"; exit 1; }
              done
            done
            echo "ok $c: $size bytes, $(printf '%s\n' "$files" | wc -l) files"
          done
          # Build the CLI from the unpacked packages alone, offline.
          un="$RUNNER_TEMP/unpacked"; rm -rf "$un"; mkdir -p "$un"
          cfg=()
          for c in $crates; do
            tar -xzf "target/package/$c-0.1.0.crate" -C "$un"
            cfg+=(--config "patch.crates-io.$c.path=\"$un/$c-0.1.0\"")
          done
          cargo install --path "$un/aethelgard-cli-0.1.0" --locked --offline --root "$un/root" "${cfg[@]}"
          "$un/root/bin/aethelgard" validate < examples/sentinel-01-minimal.json

  # Tier 2: the tool subcommands against the real tools, inside the image
  # pinned by container/IMAGE (RUL-15). Crates are fetched and everything is
  # compiled with the network; every tool run happens under --network none.
  #
  # AET-WO-1907: the job's tests run in four shards, balanced by measured weight
  # (ci/test-weights.tsv), so each finishes in under 15 minutes. Each shard lists
  # every test from the code (ci/shard.sh plan), assigns them with the same
  # deterministic rule, and a guard fails the run unless the four lists are
  # disjoint and their union is the list. The aggregate below, named `tools` so a
  # required check of that name still means "all of tier 2", is green only when
  # all four shards ran exactly what they were assigned and the canary floor holds.
  tools-shard:
    name: tools-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      RUN: >-
        docker run --rm -v ${{ github.workspace }}:/repo -w /repo
        -e CARGO_HOME=/repo/target/cargo-home -e CARGO_TARGET_DIR=/repo/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      - name: fetch crates and build, with the network
        run: $RUN "$(cat container/IMAGE)" cargo test --workspace --all-targets --locked --features aethelgard-cli/with-tools --no-run

      # AET-WO-2200: the bridge builds into target/debug/, beside the aethelgard
      # binary the tier-2 tests run, because the CLI looks for it there. Every
      # shard needs it; only shard 0 runs its fmt and clippy.
      - name: build the analog bridge and its tests, with the network
        run: $RUN "$(cat container/IMAGE)" bash -c "cargo build --manifest-path bridge/Cargo.toml --locked && cargo test --manifest-path bridge/Cargo.toml --locked --no-run"

      - name: cargo fmt inside the image
        if: matrix.shard == 0
        run: $RUN --network none "$(cat container/IMAGE)" cargo fmt --all -- --check

      - name: cargo clippy inside the image, tier 2 included
        if: matrix.shard == 0
        run: $RUN --network none "$(cat container/IMAGE)" cargo clippy --workspace --all-targets --locked --offline --features aethelgard-cli/with-tools -- -D warnings

      # The full test list, the four-way assignment and the guard (ci/shard.sh).
      # The bridge's tests are in the list, so they are assigned like any other.
      - name: list every test, assign the shards, run the guard
        run: $RUN --network none "$(cat container/IMAGE)" bash ci/shard.sh plan target/ci-shard 4

      - name: cargo test inside the image, this shard's tests
        run: $RUN --network none "$(cat container/IMAGE)" bash ci/shard.sh run target/ci-shard ${{ matrix.shard }}

      - name: keep what the aggregate checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.shard }}
          path: |
            target/ci-shard/result.txt
            target/ci-shard/entries.tsv
            target/ci-shard/shard.tsv
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  tools:
    needs: tools-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 64 (AET-WO-1900), plus 3 from AET-WO-3200 in attribute_seeded.rs: two
      # tier-2 tests (propose on every seeded case and the re-gate; committed
      # proposals re-run to their bytes) and one tier-1 test the canary counts too
      # (committed proposals' shape). The floor stays exact.
      # 71: plus 4 from AET-WO-3301 in board_tier2.rs (build at two paths,
      # prove --spec provenance, verify 2k2 twice with --against, verify 47k).
      # 73: plus 2 from AET-WO-1601 in board_tier2.rs (a third uid cannot change
      # what build reads; another uid's /tmp/.cargo is not read).
      # 74: plus 1 from AET-WO-1305 in board_tier2.rs (a board swapped in
      # verify's scratch before extract is a BindingMismatch).
      TIER2_MIN: "74"
    steps:
      # A shard that was skipped or cancelled is not a pass.
      - name: every shard job succeeded
        run: test "${{ needs.tools-shard.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards

      # The guard fails each run it exists to fail (AET-WO-1907 §3), on fixtures.
      - name: the guard's own test
        run: bash ci/test-shard.sh

      # AET-WO-1900 (review A7.3): all of tier 2 sits behind `#![cfg(feature = "with-tools")]`,
      # so a dropped flag or a skipped suite would leave this job green with no
      # Kani, Renode or KiCad test run. The shards count the tests that passed in
      # the tier-2 test binaries (the regexp is TIER2_RE in ci/shard.sh); this sums
      # them across the shards, prints the count, and fails under the pinned floor.
      # The same step checks that the four shards ran one plan, each exactly what
      # it was assigned, and that every listed test passed once.
      # Raise TIER2_MIN with the tier-2 tests; never lower it to pass.
      - name: the tier-2 canary, and the guard across the shards
        run: python3 -I ci/shard.py aggregate shards 4 "$TIER2_MIN"
