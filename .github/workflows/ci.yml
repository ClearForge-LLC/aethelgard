name: ci

on:
  pull_request:
  push:
    branches: [main]
  # AET-WO-3401 Q1 (i), ruled on PR #190: runs the bench-package job (below)
  # on any branch; `write` makes it write the package instead of comparing.
  workflow_dispatch:
    inputs:
      write:
        description: "bench-package: write fab/sentinel-01-bench/package as an artifact (verify --fab-out) instead of comparing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pinned image, the checkout at /repo, its target/ and cargo home (tools-build, tools-shard, bench-package).
  RUN: >-
    docker run --rm -v ${{ github.workspace }}:/repo -w /repo
    -e CARGO_HOME=/repo/target/cargo-home -e CARGO_TARGET_DIR=/repo/target

jobs:
  # AET-WO-1911 §1.1: ci/route.sh decides whether the diff touches only documents. The same job runs the
  # routing's own test and the inventory guard on every event, and turns ci/SHARDS into the shard matrix.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      class: ${{ steps.decide.outputs.class }}
      matrix: ${{ steps.n.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and both its parents.
          fetch-depth: 2
      - name: the routing's own test
        run: bash ci/test-route.sh
      - name: the inventory guard (every test that names a docs-only path is classified)
        run: bash ci/route.sh check ci/docs-tests.tsv
      - id: decide
        name: classify the diff
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash ci/route.sh decide "$GITHUB_EVENT_NAME" | tee "$RUNNER_TEMP/route.txt"
          grep '^class=' "$RUNNER_TEMP/route.txt" >> "$GITHUB_OUTPUT"
      - id: n
        run: |
          n=$(tr -d '[:space:]' < ci/SHARDS)
          case $n in ''|*[!0-9]*|0) echo "ci/SHARDS must hold a positive integer" >&2; exit 1;; esac
          echo "matrix=[$(seq -s, 0 $((n - 1)))]" >> "$GITHUB_OUTPUT"

  # A required check. It runs whatever the routing did (always()), so a failed or cancelled
  # route fails it instead of skipping it, which a required check would count as passed.
  gates:
    needs: route
    if: always()
    runs-on: ubuntu-latest
    env:
      CLASS: ${{ needs.route.outputs.class }}
    steps:
      - name: the routing decided
        run: |
          test "${{ needs.route.result }}" = success || { echo "route: ${{ needs.route.result }}"; exit 1; }
          case $CLASS in docs|code) echo "class: $CLASS";; *) echo "no class: '$CLASS'"; exit 1;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version

      - run: cargo fmt --all -- --check

      - if: env.CLASS == 'code'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The analog bridge is outside the workspace (AET-WO-2200). Neither check
      # links, so both run here without libngspice; its tests run in `tools`.
      - if: env.CLASS == 'code'
        run: cargo fmt --manifest-path bridge/Cargo.toml -- --check
      - if: env.CLASS == 'code'
        run: cargo clippy --manifest-path bridge/Cargo.toml --all-targets --locked -- -D warnings
      # The CLI refuses a tool call that inherits a descriptor above 2 without
      # close-on-exec (B2); this host's runner leaks two (B7). The caller
      # must not leak, so the step prints what it inherited, then closes every
      # descriptor above 2 in a subshell (the step's own script stays open)
      # before cargo runs.
      - name: cargo test, with inherited descriptors closed
        run: |
          ls -l /proc/$$/fd
          grep -Hs '^flags:' /proc/$$/fdinfo/* || true
          (
            for fd in /proc/$BASHPID/fd/*; do
              n=${fd##*/}
              if [ "$n" -gt 2 ]; then eval "exec $n>&-"; fi
            done
            ls -l /proc/self/fd
            # Docs-only (AET-WO-1911 §1.1): with fmt, above, every test target ci/docs-tests.tsv says reads a
            # docs-only file, and nothing else.
            if [ "$CLASS" = docs ]; then exec bash ci/route.sh docs-tests ci/docs-tests.tsv; fi
            # AET-WO-1910 D5 (a): every test target but ci/tools-only.tsv's (ci/gates.sh).
            exec bash ci/gates.sh run
          )

      - name: validate the checked-in examples
        if: env.CLASS == 'code'
        run: |
          cat examples/sentinel-01-minimal.json | cargo run -q -p aethelgard-cli -- validate
          status=0
          cat examples/invalid-zero-domain.json | cargo run -q -p aethelgard-cli -- validate || status=$?
          test "$status" -eq 2

      # AET-WO-1800: every publishable crate packages, in dependency order, and
      # the CLI builds from those packages alone. No token, no publish.
      - name: package every publishable crate and build the CLI from the packages
        if: env.CLASS == 'code'
        run: |
          set -euo pipefail
          # Dependency order: cargo packages a path dependency's sibling from the
          # same invocation, so this list is also the order docs/releasing.md publishes in.
          crates="aethelgard-ir aethelgard-kicad-lib aethelgard-renode-models aethelgard-svd-hal aethelgard-eda aethelgard-twin aethelgard-chaos aethelgard-evolve aethelgard-pincheck aethelgard-hwdef aethelgard-cli"
          # The list must be exactly the workspace members that may publish.
          want=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort | tr '\n' ' ')
          have=$(printf '%s\n' $crates | sort | tr '\n' ' ')
          test "$want" = "$have" || { echo "publishable set drifted: workspace [$want] vs step [$have]"; exit 1; }
          args=""; for c in $crates; do args="$args -p $c"; done
          # The workspace version, read once (AET-WO-1801): every crate shares it,
          # so a release bump needs no edit here.
          v=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "aethelgard-cli") | .version')
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no workspace version: [$v]"; exit 1; }
          echo "ANSWER package_version=$v"
          rm -rf target/package
          # --no-verify (AET-WO-3200 F18, ruled 2026-11-12): once a version is on
          # crates.io, cargo's verify build resolves a sibling to the published copy,
          # which lacks any API added since, and that holds until the next bump
          # (AET-WO-1801). The build below, offline from the unpacked packages alone
          # with every sibling patched to them, is the check.
          cargo package --locked --no-verify $args
          for c in $crates; do
            crate="target/package/$c-$v.crate"
            files=$(tar -tzf "$crate" | grep -v '/$' | sed 's|^[^/]*/||')
            size=$(stat -c %s "$crate")
            test "$size" -lt $((10 * 1024 * 1024)) || { echo "$c: $size bytes is over the 10 MiB crates.io limit"; exit 1; }
            # kicad-lib is CC-BY-SA-4.0 AND (MIT OR Apache-2.0): KiCad's files with KiCad's LICENSE.md,
            # and our own (AET-WO-4220b) with ours and their README.
            need="README.md LICENSE-MIT LICENSE-APACHE"
            if [ "$c" = aethelgard-kicad-lib ]; then
              need="$need data/kicad-10.0.7/LICENSE.md data/aethelgard/README.md"
            fi
            if [ "$c" = aethelgard-svd-hal ]; then
              need="$need data/st-cmsis-device-h7/LICENSE.md data/st-cmsis-device-h7/SOURCE.md data/st-open-pin-data/LICENSE data/st-open-pin-data/SOURCE.md"
            fi
            for f in $need; do
              printf '%s\n' "$files" | grep -qxF "$f" || { echo "$c: licence or notice file $f is missing from the package"; exit 1; }
            done
            bad=$(printf '%s\n' "$files" | grep -E '(^|/)(target|\.git|boards)(/|$)' | head -1 || true)
            test -z "$bad" || { echo "$c: forbidden path $bad in the package"; exit 1; }
            # Every include_bytes!/include_str! target must be in the package.
            for f in $(printf '%s\n' "$files" | grep -E '^src/.*\.rs$'); do
              for t in $(tar -xzOf "$crate" "$c-$v/$f" | tr -s ' \n' '  ' \
                  | grep -oE 'include_(bytes|str)! ?\( ?"[^"]+"' | sed -E 's/^[^"]*"//; s/"$//'); do
                norm=$(realpath -m --relative-to=/pkg "/pkg/$(dirname "$f")/$t")
                printf '%s\n' "$files" | grep -qxF "$norm" \
                  || { echo "$c: include target $t (from $f) is missing from the package"; exit 1; }
              done
            done
            echo "ok $c: $size bytes, $(printf '%s\n' "$files" | wc -l) files"
          done
          # Build the CLI from the unpacked packages alone, offline.
          un="$RUNNER_TEMP/unpacked"; rm -rf "$un"; mkdir -p "$un"
          cfg=()
          for c in $crates; do
            tar -xzf "target/package/$c-$v.crate" -C "$un"
            cfg+=(--config "patch.crates-io.$c.path=\"$un/$c-$v\"")
          done
          cargo install --path "$un/aethelgard-cli-$v" --locked --offline --root "$un/root" "${cfg[@]}"
          "$un/root/bin/aethelgard" validate < examples/sentinel-01-minimal.json

  # Tier 2: the tool subcommands against the real tools, inside the image
  # pinned by container/IMAGE (RUL-15). Crates are fetched and everything is
  # compiled with the network; every tool run happens under --network none.
  #
  # AET-WO-1907: the job's tests run in shards (ci/SHARDS), balanced by measured weight
  # (ci/test-weights.tsv), so each finishes in under 15 minutes. Each shard lists
  # every test from the code (ci/shard.sh plan), assigns them with the same
  # deterministic rule, and a guard fails the run unless the lists are
  # disjoint and their union is the list. The aggregate below, named `tools` so a
  # required check of that name still means "all of tier 2", is green only when
  # all the shards ran exactly what they were assigned and the canary floor holds.
  # The number of shards is one constant, ci/SHARDS: the route job turns it into the matrix,
  # ci/shard.sh plan reads it, and the aggregate reads it.
  # AET-WO-1911 §1.2: the shards' test binaries, built once per run and shared (ci/shard.sh build, pack).
  tools-build:
    needs: route
    if: needs.route.outputs.class == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      # AET-WO-2200: the bridge builds into target/debug/, beside the aethelgard
      # binary the tier-2 tests run, because the CLI looks for it there.
      - name: fetch crates and build every test binary and the analog bridge, with the network
        run: $RUN "$(cat container/IMAGE)" bash ci/shard.sh build

      - name: pack target/ with its stamp
        run: bash ci/shard.sh pack "$RUNNER_TEMP/tools-build"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-build
          path: ${{ runner.temp }}/tools-build/
          if-no-files-found: error
          # The archive is zstd already.
          compression-level: 0
          overwrite: true
          retention-days: 1

  tools-shard:
    name: tools-shard (${{ matrix.shard }})
    needs: [route, tools-build]
    if: needs.route.outputs.class == 'code'
    runs-on: ubuntu-latest
    # A hang guard, not a budget (AET-WO-4230 Q-K, ruled on PR #161, comment 6911424608): the gate is a
    # balanced plan (ci/shard.sh), and 20 minutes per shard is a target. 45 -> 60 (AET-WO-1314, ruled
    # on PR #227, comment 6991936758): one plan, shard 4 at 36.0 min on run 44382374239 and cut at
    # 45.3 min on run 44392056403, runner variance; still catches a hang, 15 minutes later.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.route.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      # AET-WO-1911 §1.2: this run's tools-build archive (ci/shard.sh unpack).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools-build
          path: ${{ runner.temp }}/tools-build

      - name: unpack the shared build
        run: bash ci/shard.sh unpack "$RUNNER_TEMP/tools-build"

      # The full test list, the assignment and the guard (ci/shard.sh plan).
      # The bridge's tests are in the list, so they are assigned like any other.
      - name: list every test, assign the shards, run the guard
        run: $RUN --network none "$(cat container/IMAGE)" bash ci/shard.sh plan target/ci-shard

      - name: cargo fmt inside the image
        if: matrix.shard == 0
        run: $RUN --network none "$(cat container/IMAGE)" cargo fmt --all -- --check

      # Clippy's check build is its own, not a test binary: it runs after plan has found the shared build fresh.
      - name: cargo clippy inside the image, tier 2 included
        if: matrix.shard == 0
        run: $RUN --network none "$(cat container/IMAGE)" cargo clippy --workspace --all-targets --locked --offline --features aethelgard-cli/with-tools -- -D warnings

      - name: cargo test inside the image, this shard's tests
        run: $RUN --network none "$(cat container/IMAGE)" bash ci/shard.sh run target/ci-shard ${{ matrix.shard }}

      - name: keep what the aggregate checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.shard }}
          path: |
            target/ci-shard/result.txt
            target/ci-shard/entries.tsv
            target/ci-shard/shard.tsv
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  tools:
    needs: [route, tools-build, tools-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASS: ${{ needs.route.outputs.class }}
      # 64 (AET-WO-1900), plus 3 from AET-WO-3200 in attribute_seeded.rs: two
      # tier-2 tests (propose on every seeded case and the re-gate; committed
      # proposals re-run to their bytes) and one tier-1 test the canary counts too
      # (committed proposals' shape). The floor stays exact.
      # 71: plus 4 from AET-WO-3301 in board_tier2.rs (build at two paths,
      # prove --spec provenance, verify 2k2 twice with --against, verify 47k).
      # 73: plus 2 from AET-WO-1601 in board_tier2.rs (a third uid cannot change
      # what build reads; another uid's /tmp/.cargo is not read).
      # 74: plus 1 from AET-WO-1305 in board_tier2.rs (a board swapped in
      # verify's scratch before extract is a BindingMismatch).
      # 75: plus 1 from AET-WO-1306 in board_tier2.rs (every corpus file the
      # strict reader accepts gets its stated KiCad verdict).
      # 77: plus 2 from AET-WO-3300 in board_tier2.rs (verify --fab-out writes
      # the package its verdict names at two paths, with --against-fab; the
      # 47k scenario writes nothing).
      # 79: plus 2 more from AET-WO-3300 (ruling D5 on PR #103): the four-run
      # fab test split into three (two-path write; --against-fab identical;
      # --against-fab naming every changed and extra file).
      # 80: plus 1 from AET-WO-1102 (`every_admitted_identifier_character_survives_every_output`:
      # one specification carrying every admitted identifier character through verify --fab-out).
      # 83: plus 3 from AET-WO-2301 in campaign_tier2.rs (the two reference
      # droops twice, byte-identical, replayed; Renode's reset recipe pinned
      # step by step; a flooding firmware reaches a verdict, twice the same).
      # 90: plus 7 from AET-WO-2204 in twin_tier2.rs (every-register and
      # wrong-address forgeries; two devices, each read witnessed; a core
      # parked in its fault handler; the judge's own locked reads; a late
      # locked access in a flood; a reserved device name breaks the load;
      # Renode's configuration against its default). Two tests renamed.
      # 91: plus 1 from AET-WO-2204's adversarial A1 (a firmware that rewrites
      # its loop in flash is not parked).
      # 90 (AET-WO-1909, ruled on PR #115): minus 1, attribute_seeded.rs's
      # oq_03_the_reference_runs_bytes_with_kind_15 removed (it asserted only
      # what ran() asserts; ran() prints its data). Six tests moved out of
      # board_tier2.rs, each still counted: verify_2k2_tier2.rs
      # (verify_binds_the_reference_and_two_runs_print_the_same_bytes,
      # verify_fab_out_writes_the_package_its_verdict_names_at_any_path; each
      # with its own runs) and two binaries that share one verify run:
      # against_fab_tier2.rs (verify_against_fab_finds_the_package_it_wrote_identical,
      # verify_against_fab_names_every_changed_and_extra_file) and
      # verify_47k_tier2.rs (verify_fails_the_47k_pull_up_with_the_campaigns_findings,
      # verify_fab_out_writes_nothing_when_a_gate_fails). Two counted tests are
      # vacuous while proposals/ is absent, and each logs so:
      # every_committed_proposal_is_pull_up_changes_named_for_its_scenario and
      # tier2::every_committed_proposal_reruns_to_its_own_bytes_and_regates.
      # 92: plus 2 from AET-WO-4100 in board_tier2.rs (the 4-layer fixture passes every gate
      # and its package holds; --against-fab names a missing inner layer and a lying stackup).
      # 96: plus 4 from AET-WO-4200: three in twin_tier2.rs (U4's JEDEC ID
      # witnessed behind SPI1's multiplexer; SPI forgeries unwitnessed; the
      # ICM-20948 fixture read end to end) and one in campaign_tier2.rs (a
      # droop on a board whose first read is SPI, adversarial A1).
      # 97: plus 1 from AET-WO-1307 in with_tools.rs (D3 and D1 pass ERC and DRC with
      # parity at 4 layers under the inward escape).
      # 98: plus 1 from AET-WO-4300f in board_tier2.rs (the connectors fixture passes ERC
      # and DRC with the specification's rules and parity, at 2 layers and at 4).
      # 101: plus 3 from AET-WO-1308 in with_tools.rs (the power-class and stand-in pair
      # fixtures pass ERC and DRC with parity, the pair reported; a track off its class
      # width fails DRC by the gate's rule; a part on each board edge passes ERC and DRC).
      # 103: plus 2 from AET-WO-1309 in with_tools.rs (the through-hole and thermal-via
      # fixtures pass DRC by the gate's rules, each join filled as declared; a thermal via
      # drilled other than its rule fails DRC by the gate's thermal rule).
      # 110: plus 7 from AET-WO-4300a in twin_tier2.rs (the PWM and DShot600
      # fixtures witnessed, two forgeries, motor_output_dead, Kani on the
      # motor board's timer start and clock check with its HSIDIV negative,
      # and the DShot600 fixture's campaign inside its 2 ms window, D1 ruled (a)).
      # 114: plus 4 from AET-WO-4210: in twin_tier2.rs, the 1.8 V IMU and
      # barometer fixture replaces the ICM-20948 fixture's test (minus 1, plus 1),
      # plus one seeded fault per part and an interrupt armed after the boot
      # word (plus 3); in board_tier2.rs, the fixture's transfers prove (plus 1).
      # 121: plus 7 from AET-WO-4300b in twin_tier2.rs (the console's pattern and
      # echo; the four-port fixture's ports and SBUS's tags; three forgeries: a TDR
      # store with UE clear, an echo never received, a pattern on the wrong port;
      # serial_rx_dead's dead echo; the four-port fixture's campaign and replay).
      # 127: plus 6 from AET-WO-4300b's first adversarial pass in twin_tier2.rs
      # (ADV-1 TX routed after the pattern, ADV-2 and ADV-2b PRESC, ADV-3 SBUS's M0
      # cleared before UE, ADV-4 its inversion after UE, ADV-5 a pattern on a USART
      # no port names).
      # 128: plus 1 from the PM's ruling on F4's residual in twin_tier2.rs (ADV-1b
      # PA9 routed for the first byte only, rerouted before the end).
      # 140: plus 12 from AET-WO-4220: in twin_tier2.rs, the Sentinel-02 fixture
      # with the models of our own witnessed end to end, its data read without
      # the cited wait, its platform listed with an unpinned one refused, and
      # its campaign archived with each configuration as its own step and
      # replayed (plus 4); in board_tier2.rs, its transfers prove (plus 1); in the new
      # tier-2 binary models_tier2.rs, the models driven from the monitor:
      # datasheet resets, ArduPilot's probe, rounding, data-ready, a model that
      # does not compile, the BMP581's deep start-up and read pointer, the
      # datasheets' access timing (plus 7).
      # 145: plus 5 from AET-WO-4300b's second adversarial pass in twin_tier2.rs
      # (ADV2-1 a GPIO reset through the RCC, ADV2-2 an open-drain pulled-down TX,
      # ADV2-3 a SYSRESETREQ at start, ADV2-4 an unaligned store into AFRH,
      # ADV2-5 a locked TX pin).
      # 146: plus 1 from the PM's ruling on fix 2's A2 hole in twin_tier2.rs
      # (ADV2-6 PA9's OT set, then OTYPER read-modify-written).
      # 151: plus 5 from adversarial pass 3 in twin_tier2.rs (ADV3-1 D2CFGR
      # written, ADV3-1b D2CCIP2R written, ADV3-2 SBUS's CR2 read back,
      # ADV3-4 PA9 unrouted between TDR writes, ADV3-5 PA10 unrouted after
      # the first byte); recounted in the image (shard.sh parse, 151).
      # 152: plus 1 from AET-WO-3303 in twin_tier2.rs (Kani proves every part of
      # both motor fixtures' schedule; main's 126 -> 127); recounted in the image
      # after the merge (shard.sh parse, 152).
      # 154: plus 2 from AET-WO-4300d2, merged into AET-WO-4300b (board_tier2.rs and
      # with_tools.rs, as main's 127 -> 129 states below).
      # 127: plus 1 from AET-WO-3303 (twin_tier2.rs: Kani proves every part of
      # both motor fixtures, the whole-schedule harness split).
      # 129: plus 2 from AET-WO-4300d2: board_tier2.rs (the Sentinel-02 power
      # fixture passes ERC and DRC with parity, its loop rules measured, and
      # extract; a loop part moved off its pin fails DRC by its rule) and
      # with_tools.rs (KiCad writes the pinned drill files: one tool per drill).
      # 157: plus 2 on AET-WO-4300g's branch, merged after 155: 1 from
      # AET-WO-4300g in board_tier2.rs (the reference passes the support gate
      # on KiCad's own netlist; a VDD capacitor moved off its pin fails it by
      # that role) and 1 from AET-WO-1310 (merged into that branch, PR #160).
      # 158: plus 1 from AET-WO-1603 in twin_tier2.rs (a witness line sent through
      # every firmware channel never reaches the judge).
      # 159: plus 1 from AET-WO-1311 in with_tools.rs (a seeded neck in the
      # ground zone: KiCad's refill joins it wherever route::connectivity does).
      # 160: plus 1 from AET-WO-4230 slice C2 in twin_tier2.rs (the ledger's
      # completeness: every bit the reference writes, rebuilt from Renode's
      # access log of every peripheral, is covered by a ledger row), merged
      # after 159.
      # 161: plus 1 from AET-WO-4220b in board_tier2.rs (the Sentinel-02-shaped
      # fixture, its ICM-42688-P and BMP581 from our own library, passes ERC,
      # DRC with parity and extract; a track across the BMP581's keepout fails
      # DRC on either layer).
      # 162: plus 1 from AET-WO-1312 in board_tier2.rs (the bench board, with
      # a test point on every net, BOOT0 and NRST on J2 and a reset switch,
      # passes every gate at two and four layers), merged after 161.
      # 176: plus 14 from AET-WO-2302 (twin_tier2: the 100 ms windows, the
      # adversarial passes' H1/M1/M2/L1/A2-3 cases, the open RX line; less the
      # 2 ms DShot boot test).
      # 177: plus 1 from AET-WO-3401 in board_tier2.rs (Sentinel-01 as ordered,
      # examples/sentinel-01.json, passes every board gate with no finding),
      # merged after 176.
      # 178: plus 1 from AET-WO-1313 in board_tier2.rs (the Sentinel-03
      # fixture inside its declared 100 x 100 mm bound passes every gate at
      # four layers), merged after 177.
      # 179: plus 1 from AET-WO-4400d in with_tools.rs (the IMU turned 90, 180
      # and 270 degrees with its two keep-outs passes check drc --spec
      # --schematic with no finding: KiCad holds each turned keep-out to the
      # library footprint), merged after 178.
      # 180: plus 1 from AET-WO-1313c in board_tier2.rs (each Sentinel-03
      # size sample passes every gate or is refused by name), merged after
      # 4400d's 179.
      # 183: plus 3 from AET-WO-4400e3 in twin_tier2.rs (the image's Renode
      # is the build the RETTOBASE correction is for; the fixture's nested
      # handler reads RETTOBASE 1 without it, and 0 with it, no other bit
      # moving), merged after 1313c's 180.
      # 188: plus 5 from AET-WO-4220c in models_tier2.rs (the ICM-42688-P
      # model's FIFO: fill rate in virtual time and packet bytes, the 1 kHz
      # timestamp step, STOP-on-FULL and the count's latch and order, packets
      # 1 and 2 and each selection left out, a big-endian packet with an
      # invalid slot), merged after 4400e3's 183.
      # 191: plus 3 from AET-WO-4400e in twin_tier2.rs (R1's flash controls:
      # a store into its own flash, an erase of its own sector, an erase
      # outside it).
      # 190: minus 1 from AET-WO-1605 in twin_tier2.rs (ruled on #223): the
      # pinned Renode carries upstream's RETTOBASE fix, so the CLI's
      # correction and its with-and-without test are retired; the build pin
      # and the witness (RETTOBASE 0 nested, with nothing of ours) remain.
      # 190 (AET-WO-1910, ruled on PR #233, comment 6999515740): unchanged. Two
      # tests moved from board_tier2.rs to the new tier-2 binary
      # four_layer_fab_tier2.rs, which shares one --fab-out package (D3), each
      # still counted: four_layer_fixture_passes_every_gate_and_its_package_holds
      # and against_fab_names_a_missing_inner_layer_and_a_stackup_that_lies. The
      # two tests D4 removed (campaign_tier1.rs: a_one_byte_change_to_the_trace_is_
      # a_hash_mismatch, an_extra_file_in_the_run_directory_is_refused) are tier 1,
      # outside the count.
      # 191 (AET-WO-4202; recomputed at its merge of main 52a2d62e, which
      # held 190): one tier-2
      # test, campaign_tier2.rs a_reset_on_an_instant_renode_would_run_short_
      # boots_where_the_judge_places_it (RunFor's truncation, under 60 s, no
      # weight row).
      # 193 (AET-WO-2304b, the K7 carve-out; recomputed at its merge of main
      # 03d89554, which held 191): two tier-2 tests added to
      # twin_tier2.rs, battery_sag::sentinel_03_s_campaign_meets_every_expectation_replays_and_repeats
      # and battery_sag::the_power_fixture_s_campaign_meets_every_expectation_replays_and_repeats
      # (the tree boards' campaigns, replayed and run twice).
      # 194 (AET-WO-3305; recomputed at its merge of main 3341dc6b, which
      # held 193): one tier-2 test, twin_tier2.rs a_fault_on_a_bus_with_two_
      # devices_is_not_masked_and_a_wrong_address_still_is_software.
      # 195 (AET-WO-2306, on main 416a6dd3; CI counted 195 on bc96bc3f): one
      # tier-2 test, board_tier2.rs verify_names_what_judged_nothing_on_the_motor_driver.
      # 198 (AET-WO-2305; recomputed at its merge of main d0c4cfe0, which
      # held 195): three tier-2 tests in twin_tier2.rs,
      # bor_recovery::the_logger_recovers_with_its_first_devices_later_steps_witnessed,
      # the_bmp581_extension_recovers_after_its_settle and
      # the_sentinel_02_shape_recovers_after_its_imus_settle (8.2 s, 9.6 s,
      # 13.6 s in the image on Furnace; twin_tier2 is lock-serialised, so
      # each has a weight row). AET-WO-3306 adds one (199):
      # twin_tier2's a_step_sent_to_another_devices_address_that_answers_is_the_softwares
      # (3.2 s in the image on Furnace; a weight row).
      # 200 (AET-WO-4241, at its merge of main 472d2d84, which held 199): one
      # tier-2 test in twin_tier2.rs,
      # the_unmodelled_read_moves_each_modelled_status_write_by_at_most_32_instructions.
      TIER2_MIN: "200"
    steps:
      # A required check: it reports the routing (AET-WO-1911 §1.1). Green on a docs-only pull request
      # only when the route job succeeded, said docs, and the build and every shard were skipped.
      - name: the routing decided
        run: |
          test "${{ needs.route.result }}" = success || { echo "route: ${{ needs.route.result }}"; exit 1; }
          case $CLASS in
            docs)
              test "${{ needs.tools-build.result }}" = skipped && test "${{ needs.tools-shard.result }}" = skipped \
                || { echo "docs-only, but tools-build ${{ needs.tools-build.result }}, tools-shard ${{ needs.tools-shard.result }}"; exit 1; }
              echo "docs-only: no tier-2 test runs on this pull request, by the route job's decision; main's push runs them all" ;;
            # A shard that was skipped or cancelled is not a pass.
            code) test "${{ needs.tools-shard.result }}" = success || { echo "tools-shard ${{ needs.tools-shard.result }}"; exit 1; } ;;
            *) echo "no class: '$CLASS'"; exit 1 ;;
          esac

      - if: env.CLASS == 'code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.CLASS == 'code'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards

      # The guard fails each run it exists to fail (AET-WO-1907 §3), on fixtures.
      - name: the guard's own test
        if: env.CLASS == 'code'
        run: bash ci/test-shard.sh

      # AET-WO-1900 (review A7.3): all of tier 2 sits behind `#![cfg(feature = "with-tools")]`,
      # so a dropped flag or a skipped suite would leave this job green with no
      # Kani, Renode or KiCad test run. The shards count the tests that passed in
      # the tier-2 test binaries (the regexp is TIER2_RE in ci/shard.sh); this sums
      # them across the shards, prints the count, and fails under the pinned floor.
      # The same step checks that the shards ran one plan, each exactly what
      # it was assigned, and that every listed test passed once.
      # Raise TIER2_MIN with the tier-2 tests; never lower it to pass.
      - name: the tier-2 canary, and the guard across the shards
        if: env.CLASS == 'code'
        run: bash ci/shard.sh aggregate shards "$(tr -d '[:space:]' < ci/SHARDS)" "$TIER2_MIN"

  # AET-WO-3401 Q1 (i), ruled on PR #190: the fabrication package of Sentinel-01
  # as ordered (examples/sentinel-01.json, boards/sentinel-01-bench) derived
  # again, byte for byte, by `verify --against-fab` against the committed
  # fab/sentinel-01-bench/package. One verify (510-579 s on CI for the
  # comparable reference). It ran on main's push and on workflow_dispatch only
  # until AET-WO-1910 D8 (i), ruled on PR #233 (comment 6999515740): AET-WO-1605
  # moved every bench scenario's state_sequence_hash, which MANIFEST.json binds,
  # and main went red unseen on its PR (fixed forward by AET-WO-1605c, #232). It
  # now runs on every pull request too, in parallel with the shards, so a change
  # to the verdict's recorded fields is seen on the PR that makes it. A red main
  # from this job is fixed forward (roadmap section 6, main is green). A docs-only
  # pull request skips it (AET-WO-1911 §1.1): no document is a verify input.
  # The verdict, and so MANIFEST.json, names each gate's sandbox, so the
  # committed package is the one this job writes (dispatch with `write`, then
  # commit the artifact's files), never one written on another machine.
  bench-package:
    needs: route
    if: needs.route.outputs.class == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The scenarios in the order MANIFEST.json records (bench_board_tier1.rs, SCENARIOS).
      VERIFY: >-
        target/debug/aethelgard verify --spec examples/sentinel-01.json
        --scenarios scenarios/sentinel-01-bench/pullup-3k3.json scenarios/sentinel-01-bench/droop-bor3.json
        scenarios/sentinel-01-bench/spi-absent-u4.json scenarios/sentinel-01-bench/pullup-2k2.json
        scenarios/sentinel-01-bench/serial-rx-open-console.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      # The bridge builds beside the aethelgard binary, where the CLI looks for it.
      - name: build the CLI and the analog bridge, with the network
        run: $RUN "$(cat container/IMAGE)" bash -c "cargo build --locked -p aethelgard-cli && cargo build --manifest-path bridge/Cargo.toml --locked"

      - name: verify --against-fab, the committed package derived again
        if: ${{ !inputs.write }}
        run: $RUN --network none "$(cat container/IMAGE)" $VERIFY --against-fab fab/sentinel-01-bench/package

      - name: verify --fab-out, the package written for committing
        if: ${{ inputs.write }}
        run: $RUN --network none "$(cat container/IMAGE)" $VERIFY --fab-out target/bench-package

      - name: keep the written package
        if: ${{ inputs.write }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-package
          path: target/bench-package/
          if-no-files-found: error
          retention-days: 7
