# The pinned tools image (AET-WO-0200). Pull requests that touch container/ or
# this file build the image on the runner, smoke-test it with and without the
# network, and run the workspace gates inside it; they never publish. A push to
# main does the same and then publishes from one job, the only one holding
# packages: write.
name: tools-image

on:
  pull_request:
    paths:
      - "container/**"
      - ".github/workflows/tools-image.yml"
  push:
    branches: [main]
    paths:
      - "container/**"
      - ".github/workflows/tools-image.yml"

permissions:
  contents: read

env:
  IMAGE: aethelgard-tools:ci

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: runner disk
        run: echo "ANSWER runner disk_free_before=$(df -BG --output=avail / | tail -1 | tr -d ' ')"

      - name: refuse unpinned bases, unchecked downloads and unpinned packages
        run: bash container/check-pins.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: container
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=tools-image
          cache-to: type=gha,mode=max,scope=tools-image

      - name: image size
        run: |
          echo "ANSWER image_bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE")"
          echo "ANSWER runner disk_free_after_build=$(df -BG --output=avail / | tail -1 | tr -d ' ')"

      - name: smoke
        run: docker run --rm -v "$PWD/container:/container:ro" "$IMAGE" bash /container/smoke.sh

      - name: smoke with --network none
        run: docker run --rm --network none -v "$PWD/container:/container:ro" "$IMAGE" bash /container/smoke.sh

      - name: cargo fmt inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo fmt --all -- --check

      - name: cargo clippy inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo test --workspace --locked

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: container
          push: true
          tags: ghcr.io/clearforge-llc/aethelgard-tools:${{ github.sha }}
          cache-from: type=gha,scope=tools-image

      # container/IMAGE is updated by a pull request from this digest; CI never
      # writes to the repository.
      - name: record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "ANSWER published=ghcr.io/clearforge-llc/aethelgard-tools@$DIGEST"
          echo "Published \`ghcr.io/clearforge-llc/aethelgard-tools@$DIGEST\` from \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
