# The pinned tools image (AET-WO-0200). Pull requests that touch container/ or
# this file build the image on the runner, smoke-test it with and without the
# network, and run the workspace gates inside it; they never publish. A push to
# main does the same and then publishes from one job, the only one holding
# packages: write. Every build's written source offer, /SOURCES.md, is read
# back from the image (AET-WO-4403).
name: tools-image

on:
  pull_request:
    paths:
      - "container/**"
      - ".github/workflows/tools-image.yml"
  push:
    branches: [main]
    paths:
      - "container/**"
      - ".github/workflows/tools-image.yml"

permissions:
  contents: read

env:
  IMAGE: aethelgard-tools:ci

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: runner disk
        run: echo "ANSWER runner disk_free_before=$(df -BG --output=avail / | tail -1 | tr -d ' ')"

      - name: refuse unpinned bases, unchecked downloads and unpinned packages
        run: bash container/check-pins.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: container
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=tools-image
          cache-to: type=gha,mode=max,scope=tools-image

      - name: image size
        run: echo "ANSWER image_bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE")"

      - name: smoke
        run: docker run --rm -v "$PWD/container:/container:ro" "$IMAGE" bash /container/smoke.sh

      - name: smoke with --network none
        run: docker run --rm --network none -v "$PWD/container:/container:ro" "$IMAGE" bash /container/smoke.sh

      # AET-WO-4403: the labels point at the written source offer, and
      # /SOURCES.md names what this image holds.
      - name: the source offer in the built image
        run: |
          bash container/check-sources.sh labels tools "$IMAGE"
          docker run --rm --network none -v "$PWD/container:/container:ro" "$IMAGE" bash /container/check-sources.sh inside tools --drift warn

      - name: cargo fmt inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo fmt --all -- --check

      - name: cargo clippy inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test inside the image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" cargo test --workspace --locked

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      TAG: ghcr.io/clearforge-llc/aethelgard-tools:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: container
          tags: ${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.documentation=https://github.com/ClearForge-LLC/aethelgard/blob/${{ github.sha }}/container/TOOLS-SOURCES.md
          load: true
          cache-from: type=gha,scope=tools-image

      # The image pushed is the image smoke-tested here, not a rebuild of it.
      - name: smoke the image about to be published
        run: docker run --rm --network none -v "$PWD/container:/container:ro" "$TAG" bash /container/smoke.sh

      # AET-WO-4407 (4403 Q3): the pin is tied to its commit by this label too.
      - name: the revision label is the commit published
        run: |
          got=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$TAG")
          [ "$got" = "$GITHUB_SHA" ] || { printf 'revision label is %q, not %s\n' "${got:0:80}" "$GITHUB_SHA" >&2; exit 1; }

      - name: the source offer in the image about to be published
        run: |
          bash container/check-sources.sh labels tools "$TAG" "$GITHUB_SHA"
          docker run --rm --network none -v "$PWD/container:/container:ro" "$TAG" bash /container/check-sources.sh inside tools

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # AET-WO-4403 D5 (Scotty, #176): every GPL-2.0-only Debian source package
      # the image holds, next to it and before it, one artifact per package and
      # version; only the ones not yet there are pushed.
      - name: mirror the GPL-2.0-only Debian sources
        run: |
          ORAS=$(bash container/oci-mirror.sh oras "$RUNNER_TEMP/oras")
          start=$(date +%s)
          ORAS=$ORAS python3 -I container/debian-src.py publish ghcr.io/clearforge-llc/aethelgard-tools container/TOOLS-DEBIAN-GPL2.tsv "$RUNNER_TEMP/debian-src"
          echo "ANSWER debian_mirror_s=$(( $(date +%s) - start ))"

      # AET-WO-4407 (4403 D4): GtkSharp's source at the commit GTK# 3.24.24.95
      # was built from, next to the image and before it.
      - name: mirror GtkSharp's source
        run: |
          ORAS=$(bash container/oci-mirror.sh oras "$RUNNER_TEMP/oras-g")
          ORAS=$ORAS bash container/gtksharp-source.sh publish ghcr.io/clearforge-llc/aethelgard-tools "$RUNNER_TEMP/gtksharp"

      # container/IMAGE is updated by a pull request from this digest; CI never
      # writes to the repository.
      - name: push and record the digest
        run: |
          docker push "$TAG"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$TAG")
          echo "Published \`$digest\` from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # D5 acceptance: an anonymous client fetches every mirrored Debian source by
  # its pinned digest. No login and no token: curl reads no netrc and no
  # docker config.
  source:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch every GPL-2.0-only Debian source anonymously by its pinned digest
        run: python3 -I container/debian-src.py fetch ghcr.io/clearforge-llc/aethelgard-tools container/TOOLS-DEBIAN-GPL2.tsv "$RUNNER_TEMP/debian-src"
      - name: fetch GtkSharp's source anonymously by its pinned digest
        run: bash container/gtksharp-source.sh fetch ghcr.io/clearforge-llc/aethelgard-tools "$RUNNER_TEMP/gtksharp"

  # Pull requests cannot push to ghcr (RUL-15). The GtkSharp mirror's publish
  # and fetch run end to end against a registry on the runner, so the code
  # main's publish runs has run first (AET-WO-4407), and TOOLS-SOURCES.md must
  # name the pin it publishes.
  source-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GtkSharp's source, published to a registry on the runner, then fetched anonymously
        run: |
          # distribution 3.1.2, by index digest.
          docker run -d --rm --name registry -p 127.0.0.1:5000:5000 \
            registry@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:5000/v2/ && break; sleep 0.2; done
          ORAS=$(bash container/oci-mirror.sh oras "$RUNNER_TEMP/oras")
          ORAS=$ORAS bash container/gtksharp-source.sh publish localhost:5000/clearforge-llc/aethelgard-tools "$RUNNER_TEMP/a"
          echo "a second publish finds it and pushes nothing:"
          ORAS=$ORAS bash container/gtksharp-source.sh publish localhost:5000/clearforge-llc/aethelgard-tools "$RUNNER_TEMP/b"
          pin=ghcr.io/clearforge-llc/aethelgard-tools@sha256:$(sha256sum < container/gtksharp-source.manifest.json | cut -d' ' -f1)
          grep -qF "\`$pin\`" container/TOOLS-SOURCES.md || { echo "TOOLS-SOURCES.md does not name $pin" >&2; exit 1; }
          echo "ok   TOOLS-SOURCES.md names $pin"
