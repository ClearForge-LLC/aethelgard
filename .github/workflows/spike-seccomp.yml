# AET-WO-0300a spike: inside the image pinned by container/IMAGE, measure the
# seccomp filter (S1, S3, S4, S5 via spike/s4.sh) and run every tier-1 and
# tier-2 test with the filter installed over the whole CLI (S2). Measurement
# only; the build half deletes it.
name: spike-seccomp

on:
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/spike-seccomp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN: >-
        docker run --rm -v ${{ github.workspace }}:/repo -w /repo
        -e CARGO_HOME=/repo/target/cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: runner facts
        run: |
          echo "ANSWER runner kernel=$(uname -r) docker=$(docker version --format '{{.Server.Version}}')"
          echo "ANSWER runner security_options=$(docker info --format '{{json .SecurityOptions}}')"

      - name: pull the tools image by its pinned digest
        run: docker pull "$(cat container/IMAGE)"

      - name: build the CLI, the test binaries and the probes, with the network
        run: |
          $RUN -e CARGO_TARGET_DIR=/repo/target "$(cat container/IMAGE)" \
            cargo test --workspace --locked --features aethelgard-cli/with-tools --no-run
          $RUN -e CARGO_TARGET_DIR=/repo/target/probes "$(cat container/IMAGE)" \
            cargo build --release --locked --manifest-path spike/probes/Cargo.toml

      - name: S1 S3 S4 S5 inside the image (--network none)
        run: $RUN --network none "$(cat container/IMAGE)" bash spike/s4.sh /repo/target/debug/aethelgard /repo/target/probes/release

      - name: S2 tier 1 and tier 2 with every socket family refused (--network none)
        run: |
          for t in tools_tier1 with_tools; do
            bin=$(ls target/debug/deps/$t-* | grep -v '\.d$' | head -1)
            echo "== $t under the filter: $bin"
            $RUN --network none "$(cat container/IMAGE)" \
              /repo/target/probes/release/seccomp-wrap -- "/repo/$bin" --test-threads 4 2>&1 | tee "$RUNNER_TEMP/$t.log"
            echo "ANSWER s2.$t.under_filter=$(grep -E '^test result' "$RUNNER_TEMP/$t.log" | tail -1)"
          done

      - name: S2 Renode's .NET diagnostic socket, inside the image
        run: |
          $RUN --network none "$(cat container/IMAGE)" bash -c '
            command -v strace || echo "ANSWER s2.strace=absent in the image"
            for d in unset 0; do
              e=; [ $d = 0 ] && e=DOTNET_EnableDiagnostics=0
              out=$(env $e /repo/target/probes/release/seccomp-wrap -- renode --disable-gui --console --plain \
                -e "mach create; machine LoadPlatformDescription @platforms/boards/nucleo_h753zi.repl; peripherals; quit" 2>&1 </dev/null)
              echo "ANSWER s2.renode.diagnostics_$d rc=$? cpu=$(printf %s "$out" | grep -c "cpu (CortexM)") diag_lines=$(printf %s "$out" | grep -ciE "diagnost|ipc")"
            done'
